name: Build and verify
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: node tools/verify-resources.mjs
      - run: chmod +x gradlew
      - run: ./gradlew :common:test :${{ matrix.loader }}:build --console=plain
      - name: Run server behavior tests
        if: matrix.loader == 'neoforge'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :neoforge:runGameTestServer --console=plain | tee gametest.log
          node -e "if (!/All [1-9][0-9]* required tests passed/.test(require('fs').readFileSync('gametest.log','utf8'))) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: technologia-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
