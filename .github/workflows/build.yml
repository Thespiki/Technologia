name: Build and verify
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: node tools/verify-resources.mjs
      - name: Committed resources match the generator
        if: matrix.loader == 'neoforge'
        shell: bash
        run: |
          node tools/generate-resources.mjs
          # PNG and NBT bytes depend on the zlib build, so only text output is compared.
          git diff --exit-code -- . ':(exclude)*.png' ':(exclude)*.nbt'
          # git diff ignores untracked files: a generated file that was never committed must fail too.
          untracked="$(git status --porcelain --untracked-files=all | grep '^??' || true)"
          if [ -n "$untracked" ]; then echo "Generated files are missing from the commit:"; echo "$untracked"; exit 1; fi
      - run: chmod +x gradlew
      - run: ./gradlew :common:test :${{ matrix.loader }}:build --console=plain
      - name: Run server behavior tests
        shell: bash
        run: |
          set -o pipefail
          # NeoForge runs the full suite; Fabric and Forge run loader smoke tests on a headless server.
          case "${{ matrix.loader }}" in
            fabric) task=':fabric:runGametest' ;;
            *) task=':${{ matrix.loader }}:runGameTestServer' ;;
          esac
          ./gradlew "$task" --console=plain | tee gametest.log
          node -e "if (!/All [1-9][0-9]* required tests passed/.test(require('fs').readFileSync('gametest.log','utf8'))) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: technologia-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
