name: Publish mod release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: mod-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release version and notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const properties = fs.readFileSync('gradle.properties', 'utf8');
          const version = properties.match(/^version=(.+)$/m)?.[1].trim();
          const minecraft = properties.match(/^minecraft_version=(.+)$/m)?.[1].trim();
          assert.match(version ?? '', /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/);
          assert.match(minecraft ?? '', /^\d+\.\d+(?:\.\d+)?$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Tag must match the mod version');
          assert.ok(fs.existsSync(`docs/releases/${version}.md`), 'Versioned release notes are required');
          fs.appendFileSync(process.env.GITHUB_ENV, `MOD_VERSION=${version}\nMINECRAFT_VERSION=${minecraft}\n`);
          NODE
      - run: node tools/verify-resources.mjs
      - name: Tagged resources match the generator
        shell: bash
        run: |
          node tools/generate-resources.mjs
          # PNG and NBT bytes depend on the zlib build, so only text output is compared.
          git diff --exit-code -- . ':(exclude)*.png' ':(exclude)*.nbt'
          untracked="$(git status --porcelain --untracked-files=all | grep '^??' || true)"
          if [ -n "$untracked" ]; then echo "Generated files are missing from the tag:"; echo "$untracked"; exit 1; fi
          # The jars must be built from the tagged files, not from regenerated ones.
          git checkout -- .
      - name: Build the release and test server behavior
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew packageRelease :neoforge:runGameTestServer :fabric:runGametest :forge:runGameTestServer --console=plain 2>&1 | tee release-build.log
          # One success summary per loader: NeoForge (full suite), Fabric and Forge (smoke tests).
          node -e "const n=(require('fs').readFileSync('release-build.log','utf8').match(/All [1-9][0-9]* required tests passed/g)||[]).length; if (n !== 3) { console.error('Expected 3 passing test summaries, found ' + n); process.exit(1) }"
      - name: Publish the three loader jars
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jars=()
          for loader in fabric neoforge forge; do
            jar="releases/$MOD_VERSION/technologia-$loader-$MINECRAFT_VERSION-$MOD_VERSION.jar"
            test -s "$jar"
            jars+=("$jar")
          done
          flags=()
          if [[ "${MOD_VERSION%%+*}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${jars[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Technologia $MOD_VERSION — Minecraft $MINECRAFT_VERSION" \
            --notes-file "docs/releases/$MOD_VERSION.md" "${flags[@]}"
