plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Dev-only source set (src/gametest/java, src/gametest/resources). The jar task archives
// sourceSets.main.output only, so the GameTests and their template are never shipped.
sourceSets {
    gametest
}

configurations {
    // Libraries later added to main are also visible to the tests.
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // Tests call the mod and the common code; both are compiled into main's output.
    gametestImplementation sourceSets.main.output
}

neoForge {
    version = neoforge_version
    // Puts Minecraft + NeoForge on the gametest classpaths. Must come after `version`.
    addModdingDependenciesTo sourceSets.gametest
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
        gameTestServer {
            type = 'gameTestServer'
            // Launch from the gametest classpath (gametest output + main output + NeoForge).
            sourceSet = sourceSets.gametest
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // Same FML mod in dev runs: one fml.modFolders group holds main and gametest.
            sourceSet sourceSets.gametest
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// `build` / `check` fail on test compile errors without starting the game.
tasks.named('check') { dependsOn tasks.named('gametestClasses') }
